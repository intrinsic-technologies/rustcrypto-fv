[package]
name = "sha2-program"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone package: not part of any enclosing Cargo workspace
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
# Default features except `alloc`, which adds only `DynDigest`'s boxed methods; no entry point
# calls them
sha2 = { version = "=0.11.1", default-features = false, features = ["oid"] }

# Cargo's default release profile, as downstream users build it, aborting on panic
[profile.release]
panic = "abort"
