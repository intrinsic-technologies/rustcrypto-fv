# x86-extract configuration; scripts/extract.py supplies `elf` and `output`, and installs the
# generated modules in the directory of `namespace`.
namespace = "Sha2.Spec.Program.Extracted"
code_sections = [".text"]
data_sections = [".rodata"]

# Generated address definition name = exported symbol, one per wrapper function in src/lib.rs
[entries]
sha224Digest = "sha224_digest"
sha224DigestSlices = "sha224_digest_slices"
sha224Reset = "sha224_reset"
sha224FinalizeIntoReset = "sha224_finalize_into_reset"
sha224TraitFinalizeFixedReset = "sha224_trait_finalize_fixed_reset"
sha224TraitFinalizeIntoReset = "sha224_trait_finalize_into_reset"
sha256Digest = "sha256_digest"
sha256DigestSlices = "sha256_digest_slices"
sha256Reset = "sha256_reset"
sha256FinalizeIntoReset = "sha256_finalize_into_reset"
sha256TraitFinalizeFixedReset = "sha256_trait_finalize_fixed_reset"
sha256TraitFinalizeIntoReset = "sha256_trait_finalize_into_reset"
sha384Digest = "sha384_digest"
sha384DigestSlices = "sha384_digest_slices"
sha384Reset = "sha384_reset"
sha384FinalizeIntoReset = "sha384_finalize_into_reset"
sha384TraitFinalizeFixedReset = "sha384_trait_finalize_fixed_reset"
sha384TraitFinalizeIntoReset = "sha384_trait_finalize_into_reset"
sha512Digest = "sha512_digest"
sha512DigestSlices = "sha512_digest_slices"
sha512Reset = "sha512_reset"
sha512FinalizeIntoReset = "sha512_finalize_into_reset"
sha512TraitFinalizeFixedReset = "sha512_trait_finalize_fixed_reset"
sha512TraitFinalizeIntoReset = "sha512_trait_finalize_into_reset"
sha512_224Digest = "sha512_224_digest"
sha512_224DigestSlices = "sha512_224_digest_slices"
sha512_224Reset = "sha512_224_reset"
sha512_224FinalizeIntoReset = "sha512_224_finalize_into_reset"
sha512_224TraitFinalizeFixedReset = "sha512_224_trait_finalize_fixed_reset"
sha512_224TraitFinalizeIntoReset = "sha512_224_trait_finalize_into_reset"
sha512_256Digest = "sha512_256_digest"
sha512_256DigestSlices = "sha512_256_digest_slices"
sha512_256Reset = "sha512_256_reset"
sha512_256FinalizeIntoReset = "sha512_256_finalize_into_reset"
sha512_256TraitFinalizeFixedReset = "sha512_256_trait_finalize_fixed_reset"
sha512_256TraitFinalizeIntoReset = "sha512_256_trait_finalize_into_reset"
sha2Compress256 = "sha2_compress256"
sha2Compress512 = "sha2_compress512"
