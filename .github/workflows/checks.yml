name: Checks

# Cheap repository checks on every pull request and push, without path filters, so that branch
# protection can always require them.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventions:
    name: Repository conventions
    runs-on:
      - runs-on=${{ github.run_id }}-conventions/runner=2cpu-linux-x64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Check crate registration, conventions, and workflow path filters
        run: python3 ci/crates.py check

      - name: Test crate selection
        run: python3 -m unittest discover -s ci -p 'test_crates.py'
