[package]
name = "hkdf-program"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone package: not part of any enclosing Cargo workspace
[workspace]

[lib]
crate-type = ["staticlib"]

[dependencies]
hkdf = { version = "=0.13.0", default-features = false, features = ["kdf"] }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }

# Cargo's default release profile, as downstream users build it, aborting on panic
[profile.release]
panic = "abort"
